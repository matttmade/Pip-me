<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pip-Me Personal Terminal (Fan Project)</title>
    <meta name="description" content="Unofficial Fallout fan case study: Pip-Me, a Pip-Boy style personal dashboard on a curved CRT in your browser." />
    <meta name="theme-color" content="#031007" />
    <link rel="preload" href="/fonts/alfa-slab-one-latin-400.woff2" as="font" type="font/woff2" crossorigin />
    <!--
      Boot loader (see src/loader/handoff.ts): pure inline HTML/CSS/SVG so it paints
      before the JS bundle arrives. Original art only: no Vault Boy, no Vault-Tec emblem.
    -->
    <style>
      @font-face {
        font-family: 'Pip Loader Slab';
        src: url('/fonts/alfa-slab-one-latin-400.woff2') format('woff2');
        font-display: block;
      }
      html, body { margin: 0; background: #000; }
      #pip-loader {
        --h: 135;
        --pl: hsl(var(--h) 100% 55%);
        --pl-hi: hsl(var(--h) 100% 75%);
        --pl-60: hsl(var(--h) 100% 55% / .6);
        --pl-30: hsl(var(--h) 100% 55% / .3);
        --pl-15: hsl(var(--h) 100% 55% / .15);
        --pl-bg: hsl(var(--h) 60% 4%);
        --u: min(1vw, 1.1dvh, 14px);
        position: fixed; inset: 0; z-index: 2147483000;
        display: grid; place-items: center;
        background: #000; color: var(--pl);
        overflow: hidden;
        transition: background-color .38s ease;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        text-transform: none; letter-spacing: normal; font-weight: 400;
      }
      #pip-loader.pl-out { background-color: transparent; pointer-events: none; }
      .pl-screen {
        position: absolute; inset: 0;
        display: grid; place-items: center;
        padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        box-sizing: border-box;
        background:
          radial-gradient(ellipse 75% 65% at 50% 42%, hsl(var(--h) 80% 10%) 0%, hsl(var(--h) 70% 5%) 55%, hsl(var(--h) 60% 2%) 100%);
        transform-origin: 50% 50%;
        transform: scale(0, .004);
        animation: pl-on .42s cubic-bezier(.2,.7,.2,1) .1s forwards, pl-flicker .5s steps(1) .52s 1;
      }
      /* scanlines + a slow vertical shimmer, both in the hue */
      .pl-screen::before, .pl-screen::after { content: ''; position: absolute; inset: 0; pointer-events: none; }
      .pl-screen::before {
        background: repeating-linear-gradient(to bottom, transparent 0 2px, rgb(0 0 0 / .32) 2px 3px);
        mix-blend-mode: multiply;
      }
      .pl-screen::after {
        background: linear-gradient(to bottom, transparent 0%, hsl(var(--h) 100% 55% / .05) 48%, transparent 52%);
        background-size: 100% 300%;
        animation: pl-roll 3.2s linear infinite;
      }
      .pl-stage {
        position: relative; z-index: 1;
        display: flex; flex-direction: column; align-items: center;
        gap: calc(var(--u) * 2.6);
        max-width: 100%;
      }
      /* figure + six limb meters */
      .pl-doll {
        display: grid;
        grid-template-columns: auto auto auto;
        grid-template-rows: auto auto auto;
        align-items: center; justify-items: center;
        column-gap: calc(var(--u) * 2.2);
        row-gap: calc(var(--u) * 1.4);
      }
      .pl-col { display: flex; flex-direction: column; justify-content: space-around; height: 78%; gap: calc(var(--u) * 6); }
      .pl-fig {
        grid-column: 2; grid-row: 2;
        width: calc(var(--u) * 18); height: calc(var(--u) * 34.5);
        overflow: visible;
        opacity: 0;
        animation: pl-fade .32s ease-out .5s forwards;
        filter: drop-shadow(0 0 calc(var(--u) * .6) var(--pl-60));
      }
      .pl-fig path, .pl-fig circle { stroke: var(--pl); stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; fill: var(--pl-bg); }
      .pl-fig .pl-limb path { fill: none; stroke-width: 9; }
      .pl-fig .pl-back path { stroke: var(--pl-60); }
      .pl-fig .pl-boot { fill: var(--pl); }
      .pl-fig .pl-back .pl-boot { fill: var(--pl-60); stroke: var(--pl-60); }
      .pl-fig .pl-trim { fill: none; stroke: var(--pl-hi); stroke-width: 2.5; }
      .pl-fig .pl-hair { fill: var(--pl-60); stroke-width: 2; }
      .pl-limb { transform-box: view-box; animation: pl-swing .62s ease-in-out infinite alternate; }
      .pl-arm { transform-origin: 60px 58px; }
      .pl-leg { transform-origin: 60px 118px; }
      .pl-arm.pl-front, .pl-leg.pl-back { animation-direction: alternate-reverse; }
      .pl-body { transform-box: view-box; animation: pl-bob .31s ease-in-out infinite alternate; }
      .pl-bar {
        position: relative;
        width: calc(var(--u) * 7.5); height: calc(var(--u) * 1.1); min-height: 5px;
        border: 1px solid var(--pl-60);
        box-shadow: 0 0 calc(var(--u) * .8) var(--pl-30);
        opacity: 0;
        animation: pl-fade .2s ease-out .6s forwards;
      }
      .pl-bar::after {
        content: ''; position: absolute; inset: 1px;
        background: var(--pl);
        box-shadow: 0 0 calc(var(--u) * .8) var(--pl-60);
        transform-origin: 0 50%;
        transform: scaleX(var(--f, 0));
      }
      .pl-bar--top { grid-column: 2; grid-row: 1; }
      .pl-bar--bot { grid-column: 2; grid-row: 3; }
      .pl-col--l { grid-column: 1; grid-row: 2; }
      .pl-col--r { grid-column: 3; grid-row: 2; }
      /* wordmark: copied from the Pip-Me logo (device.css .pipme-logo), loader-local */
      .pl-word {
        display: inline-flex; align-items: baseline;
        font: calc(var(--u) * 7.6)/1 'Pip Loader Slab', 'Alfa Slab One', Rockwell, Georgia, serif;
        letter-spacing: .01em;
        white-space: nowrap;
        color: var(--pl);
        text-shadow: 0 0 2px var(--pl), 0 0 calc(var(--u) * 1.6) var(--pl-60), 0 0 calc(var(--u) * 4.5) var(--pl-30);
        transform: skewX(-12deg);
        clip-path: inset(-20% 100% -20% 0);
        animation: pl-wipe .36s steps(7, end) .7s forwards;
        margin-top: calc(var(--u) * .6);
      }
      .pl-dash {
        align-self: center; width: .5em; height: .17em; margin: 0 .05em 0 .07em;
        background: currentColor; transform: translateY(.08em);
        box-shadow: 0 0 calc(var(--u) * 1.2) var(--pl-60);
      }
      .pl-speed { display: inline-flex; flex-direction: column; align-self: center; gap: .09em; margin-left: .14em; transform: translateY(.06em); }
      .pl-speed i { display: block; height: .075em; background: currentColor; border-radius: 0 1em 1em 0; box-shadow: 0 0 calc(var(--u) * 1.2) var(--pl-60); }
      .pl-speed i:nth-child(1) { width: 1.05em; }
      .pl-speed i:nth-child(2) { width: .75em; }
      .pl-speed i:nth-child(3) { width: .45em; }
      .pl-tag { display: flex; flex-direction: column; align-items: center; gap: .5em; margin-top: calc(var(--u) * -.6); }
      .pl-tag span {
        display: block;
        font: clamp(9px, min(calc(var(--u) * 1.75), calc((100vw - 40px) / 30)), 18px)/1.15 ui-monospace, 'Share Tech Mono', 'SFMono-Regular', Menlo, Consolas, 'Courier New', monospace;
        letter-spacing: .02em;
        white-space: nowrap;
        clip-path: inset(-30% 100% -30% 0);
        text-shadow: 0 0 calc(var(--u) * .9) var(--pl-60);
      }
      .pl-tag span:nth-child(1) { animation: pl-type .3s steps(43, end) .92s forwards; }
      .pl-tag span:nth-child(2) { color: var(--pl-hi); opacity: .8; animation: pl-type .32s steps(48, end) 1.06s forwards; }
      .pl-emblem {
        width: calc(var(--u) * 6.2); height: calc(var(--u) * 6.2); min-width: 30px; min-height: 30px;
        margin-top: calc(var(--u) * 1.2);
        opacity: 0;
        animation: pl-glow .5s ease-out 1.22s forwards;
      }
      .pl-emblem path, .pl-emblem circle { fill: none; stroke: var(--pl); stroke-width: 4; stroke-linejoin: round; }
      .pl-emblem .pl-bolt { fill: var(--pl); stroke: none; }
      /* exit: CRT power-off collapse */
      #pip-loader.pl-out .pl-screen { animation: pl-off .38s cubic-bezier(.6,0,.9,.4) forwards; }
      @keyframes pl-on {
        0% { transform: scale(0, .004); filter: brightness(4); }
        45% { transform: scale(1, .004); filter: brightness(4); }
        100% { transform: scale(1, 1); filter: brightness(1); }
      }
      @keyframes pl-flicker { 0% { opacity: .82; } 20% { opacity: 1; } 45% { opacity: .9; } 60% { opacity: 1; } 80% { opacity: .95; } 100% { opacity: 1; } }
      @keyframes pl-off {
        0% { transform: scale(1, 1); filter: brightness(1); opacity: 1; }
        55% { transform: scale(1, .004); filter: brightness(3.5); opacity: 1; }
        85% { transform: scale(.02, .004); filter: brightness(5); opacity: 1; }
        100% { transform: scale(0, 0); opacity: 0; }
      }
      @keyframes pl-roll { from { background-position: 0 100%; } to { background-position: 0 0; } }
      @keyframes pl-fade { to { opacity: 1; } }
      @keyframes pl-wipe { to { clip-path: inset(-20% -40% -20% -10%); } }
      @keyframes pl-type { to { clip-path: inset(-30% -2% -30% -2%); } }
      @keyframes pl-glow {
        0% { opacity: 0; filter: drop-shadow(0 0 0 transparent); }
        60% { opacity: 1; filter: drop-shadow(0 0 calc(var(--u) * 2.4) var(--pl)); }
        100% { opacity: 1; filter: drop-shadow(0 0 calc(var(--u) * .9) var(--pl-60)); }
      }
      @keyframes pl-swing { from { transform: rotate(-18deg); } to { transform: rotate(18deg); } }
      @keyframes pl-bob { from { transform: translateY(0); } to { transform: translateY(-3px); } }
      @media (orientation: portrait) { #pip-loader { --u: min(1.9vw, 1.05dvh, 9px); } }
      @media (prefers-reduced-motion: reduce) {
        .pl-screen { transform: none; animation: pl-fade .2s ease-out forwards; opacity: 0; }
        .pl-screen::after, .pl-limb, .pl-body { animation: none; }
        .pl-fig, .pl-bar, .pl-emblem { animation: pl-fade .2s ease-out forwards; }
        .pl-word { clip-path: none; animation: none; }
        .pl-tag span { clip-path: none; animation: none; }
        #pip-loader.pl-out { transition: opacity .2s ease; opacity: 0; }
        #pip-loader.pl-out .pl-screen { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="pip-loader" role="status" aria-label="Loading Pip-Me" aria-live="polite">
      <div class="pl-screen">
        <div class="pl-stage" aria-hidden="true">
          <div class="pl-doll">
            <span class="pl-bar pl-bar--top"></span>
            <div class="pl-col pl-col--l"><span class="pl-bar"></span><span class="pl-bar"></span></div>
            <svg class="pl-fig" viewBox="0 0 120 230" focusable="false">
              <g class="pl-body">
                <g class="pl-limb pl-arm pl-back"><path d="M78 58 L84 92 L82 122" /></g>
                <g class="pl-limb pl-leg pl-back"><path d="M68 118 L70 166 L69 204" /><path class="pl-boot" d="M62 204 h16 l6 8 h-22 z" /></g>
                <path d="M44 52 Q60 46 76 52 L80 76 L74 120 H46 L40 76 Z" />
                <path class="pl-trim" d="M60 50 V118 M45 104 H75 M52 50 Q60 56 68 50" />
                <g class="pl-limb pl-leg pl-front"><path d="M52 118 L50 166 L51 204" /><path class="pl-boot" d="M44 204 h16 l6 8 h-22 z" /></g>
                <g class="pl-limb pl-arm pl-front"><path d="M42 58 L36 92 L38 122" /></g>
                <circle cx="60" cy="28" r="18" />
                <path class="pl-hair" d="M42 27 Q42 8 60 8 Q78 8 78 27 Q71 15 60 16 Q49 15 42 27 Z" />
              </g>
            </svg>
            <div class="pl-col pl-col--r"><span class="pl-bar"></span><span class="pl-bar"></span></div>
            <span class="pl-bar pl-bar--bot"></span>
          </div>
          <div class="pl-word"><span>Pip</span><span class="pl-dash"></span><span>Me</span><span class="pl-speed"><i></i><i></i><i></i></span></div>
          <div class="pl-tag">
            <span>PIP-ME 3000 CALIBRATED FOR ONE (1) DWELLER.</span>
            <span>THANK YOU FOR TRUSTING VAULT-TEC WITH YOUR FACE.</span>
          </div>
          <!-- original emblem: a hex nut with a lightning bolt (not the Vault-Tec gear) -->
          <svg class="pl-emblem" viewBox="0 0 64 64" focusable="false">
            <path d="M32 4 L56 18 L56 46 L32 60 L8 46 L8 18 Z" />
            <circle cx="32" cy="32" r="17" />
            <path class="pl-bolt" d="M35 13 L22 35 H31 L28 51 L42 28 H33 Z" />
          </svg>
        </div>
      </div>
    </div>
    <script>
      // Pip-Me boot loader. Plain ES5 so it runs before (and without) the module bundle.
      // Contract with src/loader/handoff.ts: window.__pipLoader = { onExit(fn), ready() }.
      ;(function () {
        var el = document.getElementById('pip-loader')
        if (!el) return
        // Read-only hue lookup: the ONE allowed storage access outside src/lib/store.ts, so
        // returning users see their colour before the bundle loads. Never writes.
        try {
          var keys = ['sessionStorage', 'localStorage']
          for (var k = 0; k < keys.length; k++) {
            var raw = window[keys[k]].getItem('pipboy:v1:effects')
            var hue = raw ? JSON.parse(raw).hue : null
            if (typeof hue === 'number' && isFinite(hue)) { el.style.setProperty('--h', String(hue)); break }
          }
        } catch (e) { /* storage blocked: keep phosphor green */ }

        var reduce = false
        try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches } catch (e) {}
        var now = function () { return window.performance && performance.now ? performance.now() : Date.now() }
        var t0 = now()
        var MIN = reduce ? 500 : 1750 // let the intro finish before powering off
        var BAR_START = reduce ? 0 : 600, BAR_SPAN = reduce ? 250 : 700
        var OUT = reduce ? 200 : 380
        var bars = el.querySelectorAll('.pl-bar')
        var shown = 0, target = 0.1, isReady = false, exiting = false, done = false, exitFns = []
        var raise = function (v) { if (v > target) target = v }

        if (document.readyState !== 'loading') raise(0.45)
        else document.addEventListener('DOMContentLoaded', function () { raise(0.45) })
        window.addEventListener('load', function () { raise(0.8) })

        function paint() {
          var t = now() - t0
          // creep toward 80% on time alone, real milestones push further, ready completes it
          raise(0.8 * (1 - Math.exp(-t / 900)))
          shown += ((isReady ? 1 : target) - shown) * 0.18
          if (isReady && shown > 0.995) shown = 1
          var ramp = Math.max(0, Math.min(1, (t - BAR_START) / BAR_SPAN))
          var v = Math.min(shown, ramp)
          for (var i = 0; i < bars.length; i++) {
            var f = Math.max(0, Math.min(1, v * 1.15 - i * 0.03))
            bars[i].style.setProperty('--f', f.toFixed(3))
          }
          return t
        }

        function exit() {
          if (exiting) return
          exiting = true
          for (var i = 0; i < bars.length; i++) bars[i].style.setProperty('--f', '1')
          el.classList.add('pl-out')
          for (var j = 0; j < exitFns.length; j++) { try { exitFns[j]() } catch (e) { setTimeout(function () { throw e }) } }
          exitFns = []
          setTimeout(finish, OUT + 30)
        }

        function finish() {
          if (done) return
          done = true
          el.setAttribute('aria-hidden', 'true')
          el.removeAttribute('role')
          window.removeEventListener('keydown', onSkip, true)
          if (el.parentNode) el.parentNode.removeChild(el)
        }

        function loop() {
          if (exiting) return
          var t = paint()
          if (isReady && shown >= 1 && t >= MIN) return exit()
          requestAnimationFrame(loop)
        }
        requestAnimationFrame(loop)

        function onSkip() { if (isReady) exit() }
        window.addEventListener('keydown', onSkip, true)
        el.addEventListener('pointerdown', onSkip)

        // Never stick: bail out after 6s whatever happens (also covers hidden tabs where rAF sleeps).
        setTimeout(function () { isReady = true; exit() }, 6000)

        window.__pipLoader = {
          onExit: function (fn) { if (exiting) fn(); else exitFns.push(fn) },
          ready: function () {
            isReady = true
            if (document.hidden) exit()
          },
        }
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
